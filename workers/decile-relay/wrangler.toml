name = "shuckervc-decile-relay"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Secrets (set via CLI, never committed):
#   npx wrangler secret put DECILE_API_KEY     # Decile API key
#   npx wrangler secret put TURNSTILE_SECRET   # Cloudflare Turnstile secret
#   npx wrangler secret put HEALTH_TOKEN       # optional: gates /health deep check

# Cross-isolate rate limiter (5 requests / 60s per client IP). Unlike an
# in-memory counter, this is consistent across the Worker fleet.
[[unsafe.bindings]]
name = "RELAY_RL"
type = "ratelimit"
namespace_id = "1101"
simple = { limit = 5, period = 60 }

[vars]
# Pipeline "Deals - shuckerVC Fund I, LP" (validated live).
PIPELINE_ID = "2nEb978Z"
# Origins allowed to call the relay. Production domain is shuckervc.com;
# shucker.vc kept in case it's attached later; github.io + workers.dev stay
# while they serve.
ALLOWED_ORIGINS = "https://shuckervc.com,https://www.shuckervc.com,https://shuckervc.github.io,https://shucker.vc,https://www.shucker.vc,https://shuckervc-website.shuckervcwebsite.workers.dev"
# Decile REST base — per Decile's agent docs, the account-subdomain host is
# the documented REST base (bare decilehub.com worked for GETs but 401s
# Worker-originated POSTs).
DECILE_API_BASE = "https://shuckervc.decilehub.com/api/v1"
