# Cloudflare Workers static-assets config for the SITE itself.
# The Git-connected Workers build ("shuckervc-website") runs `npx wrangler
# deploy` from the repo root; this tells it to serve site/ as static assets
# (no worker script — assets-only). site/_redirects and site/_headers are
# honored by Workers assets.
#
# The form relay is a SEPARATE worker: workers/decile-relay/wrangler.toml.
name = "shuckervc-website"
compatibility_date = "2026-08-05"

[assets]
directory = "./site"

# --- Staging environment -------------------------------------------------
# A second, identical deploy of ./site to its own Worker, built from the
# `staging` branch and served at staging.shucker.vc (put Cloudflare Access in
# front of it so it stays private and unindexed). Production is the top-level
# config above and is unaffected.
#
#   Production build cmd:  npx wrangler deploy
#   Staging build cmd:     npx wrangler deploy --env staging
#
# Named environments don't inherit `assets`, so it is repeated here.
[env.staging]
name = "shuckervc-website-staging"

[env.staging.assets]
directory = "./site"
